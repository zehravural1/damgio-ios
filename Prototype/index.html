
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damgio | Giriş Yap</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f3ee;
            color: #243c32;
        }

        .app {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            margin: auto;
            padding: 32px 24px;
            background: white;
        }

        .brand {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .tagline {
            margin-top: 6px;
            color: #777b73;
            font-size: 14px;
        }

        .welcome {
            margin-top: 48px;
        }

        .welcome h1 {
            margin-bottom: 10px;
            font-size: 29px;
        }

        .welcome p {
            color: #777b73;
            line-height: 1.5;
        }

        .label {
            display: block;
            margin: 25px 0 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .roles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
        }

        .role {
            padding: 15px 5px;
            border: 1px solid #dedfd8;
            border-radius: 13px;
            background: white;
            color: #243c32;
            cursor: pointer;
        }

        .role .symbol {
            display: block;
            margin-bottom: 9px;
            font-size: 25px;
        }

        .role .role-name {
            font-size: 12px;
            font-weight: bold;
        }

        .role.active {
            border: 2px solid #365b47;
            background: #edf3e9;
        }

        .field-label {
            display: block;
            margin: 20px 0 8px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dedfd8;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #b6c9b0;
            border-color: #365b47;
        }

        .login-button {
            width: 100%;
            margin-top: 26px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #294737;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            background: #edf3e9;
            line-height: 1.5;
            font-size: 14px;
        }

        .footnote {
            margin-top: 28px;
            color: #85877f;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="app">
        <header>
            <div class="brand">damgio.</div>
            <div class="tagline">Sadakatin dijital hali.</div>
        </header>

        <section class="welcome">
            <h1>Tekrar hoş geldin!</h1>
            <p>Devam etmek için kullanıcı türünü seç ve giriş bilgilerini gir.</p>
        </section>

        <form id="loginForm">
            <label class="label">Nasıl devam etmek istiyorsun?</label>

            <div class="roles">
                <button type="button" class="role active"
                    data-role="customer" aria-pressed="true">
                    <span class="symbol">☕</span>
                    <span class="role-name">Müşteri</span>
                </button>

                <button type="button" class="role"
                    data-role="cashier" aria-pressed="false">
                    <span class="symbol">🧾</span>
                    <span class="role-name">Kasiyer</span>
                </button>

                <button type="button" class="role"
                    data-role="admin" aria-pressed="false">
                    <span class="symbol">🏪</span>
                    <span class="role-name">İşletme</span>
                </button>
            </div>

            <label class="field-label" for="email">E-posta adresi</label>
            <input
                type="email"
                id="email"
                placeholder="ornek@mail.com"
                autocomplete="email"
                required
            >

            <label class="field-label" for="password">Şifre</label>
            <input
                type="password"
                id="password"
                placeholder="Şifreni gir"
                autocomplete="current-password"
                required
            >

            <button class="login-button" type="submit">Giriş yap</button>
        </form>

        <div class="message" id="message" role="status"></div>

        <p class="footnote">
            Damgio dijital sadakat kartı prototipi<br>
            Bu ekranda gerçek kullanıcı doğrulaması yapılmaz.
        </p>
    </main>

    <script>
        let selectedRole = "customer";

        const roleButtons = document.querySelectorAll(".role");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        roleButtons.forEach(function(button) {
            button.addEventListener("click", function() {
                roleButtons.forEach(function(item) {
                    item.classList.remove("active");
                    item.setAttribute("aria-pressed", "false");
                });

                button.classList.add("active");
                button.setAttribute("aria-pressed", "true");

                selectedRole = button.dataset.role;
                message.style.display = "none";
            });
        });

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const roleNames = {
                customer: "Müşteri",
                cashier: "Kasiyer",
                admin: "İşletme sahibi"
            };

            message.textContent =
                roleNames[selectedRole] +
                " rolünü seçtin. Giriş ekranı çalışıyor; " +
                "gerçek hesap doğrulamasını sonraki aşamada ekleyeceğiz.";

            message.style.display = "block";
        });
    </script>
</body>
</html>
